name: Fan-site quality checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Capture review screens
        if: always()
        run: |
          npm run dev > /tmp/manor-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ && break || sleep 1; done
          node scripts/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manor-visual-review
          path: |
            qa/screenshots
            test-results
            playwright-report
